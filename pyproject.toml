[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-fightnet"
version = "0.1.0"
description = "PyTorch foundation for boxing punch classification with a Clifford-inspired motion representation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Clifford FightNet contributors" }
]
dependencies = [
  "torch>=2.3,<3.0",
  "torchvision>=0.18,<1.0",
  "opencv-python>=4.10,<5.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "matplotlib>=3.9,<4.0",
  "tqdm>=4.66,<5.0",
  "pyyaml>=6.0,<7.0",
  "kagglehub>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
