project_name: clifford-fightnet
seed: 42

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  outputs_dir: outputs

model:
  name: clifford_motion
  num_classes: 4
  num_frames: 16
  image_size: 112
  input_channels: 3

training:
  batch_size: 8
  num_epochs: 10
  learning_rate: 0.001
  num_workers: 2

evaluation:
  batch_size: 8
  num_workers: 2
  metrics:
    - accuracy
    - macro_f1
    - confusion_matrix
